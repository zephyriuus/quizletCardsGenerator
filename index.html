<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deck Generator by Zeph</title>
    <link rel="stylesheet" href="Assets/CSS/style.css">
    <script src="Assets/JS/script.js" defer></script>
</head>
<body>
<div class="container">
    <h1>ITExamAnswers to Quizlet Deck Generator</h1>
    <div class="two-columns">
        <div class="input-panel">
            <label style="font-weight: 600; margin-bottom: 8px; display: block;">Paste HTML (from itexamanswers.net)</label>
            <textarea id="htmlInput" placeholder='Paste the full HTML source of a quiz page...'></textarea>
            <div class="format-controls">
                <div class="format-row">
                    <label>Between question & answer:</label>
                    <input type="text" id="qaSep" value="," maxlength="3" placeholder="e.g. , or $">
                </div>
                <div class="format-row">
                    <label>Between pairs (cards):</label>
                    <input type="text" id="pairSep" value=";" maxlength="3" placeholder="e.g. ; or |">
                </div>
            </div>

            <div class="flex-buttons">
                <button id="extractBtn">Extract & format</button>
            </div>
        </div>
        <div class="output-panel">
            <label style="font-weight: 600; margin-bottom: 8px; display: block;">Extracted Q&A string</label>
            <textarea id="formattedOutput" readonly placeholder="Output will appear here..."></textarea>
            <div class="results-area">
                <div style="font-weight: 600; margin-bottom: 10px;">Preview (first 3 pairs)</div>
                <div id="previewCards"></div>
            </div>
        </div>
        <div><strong>To extract:</strong>
        <p>- Inspect the website (ITExamAnswers)</p>
        <p>- Press the sources tab</p>
        <p>- Copy all</p>
        <p>- Paste</p></div>
    </div>
    <div class="footer">
        © 2026 Starlit Sky. All rights reserved.
    </div>
</div>
</body>
</html>
