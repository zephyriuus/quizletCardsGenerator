<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q&A Extractor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>📄 Q&A → Quizlet Format</h1>

    <div class="two-columns">
        <div class="input-panel">
            <textarea id="htmlInput" placeholder="Paste HTML here..."></textarea>
            <div class="flex-buttons">
                <button id="extractBtn">Extract</button>
                <button id="copyBtn" class="copy-btn">Copy</button>
            </div>
        </div>

        <div class="output-panel">
            <textarea id="formattedOutput" readonly></textarea>
            <div id="previewCards"></div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
